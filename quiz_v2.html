function normLetters(text) {
  let t = text.toLowerCase().replace(/[^a-z\s-]/g, ' ').replace(/-/g, ' ');
  const tokens = t.split(/\s+/).filter(Boolean);
  let out = '';
  for (let i = 0; i < tokens.length; i++) {
    const tk = tokens[i];
    if (tk.length === 1 && /[a-z]/.test(tk)) { out += tk; continue; }
    if (tk === 'double' && tokens[i+1]) {
      const nxt = tokens[i+1];
      const L = Object.keys(LETTER_ALIASES).find(L => LETTER_ALIASES[L].includes(nxt));
      if (L) { out += L + L; i++; continue; }
    }
    const L = Object.keys(LETTER_ALIASES).find(L => LETTER_ALIASES[L].includes(tk));
    if (L) { out += L; continue; }
    if (tk.length > 1) out += tk;
  }
  return out;
}

function render() {
  answered = false;
  const q = QUESTIONS[cur];
  bar.style.width = (cur / QUESTIONS.length * 100) + '%';
  counter.textContent = `第 ${cur+1} / ${QUESTIONS.length} 题`;
  nextBtn.disabled = true;
  nextBtn.textContent = cur === QUESTIONS.length - 1 ? '查看结果' : '下一题';
  let tag = '';
  if ([0,10,30,50].includes(cur)) tag = `<div class="section-tag">${sectionTag(cur)}</div>`;
  if (q.type === 'dict') renderDict(q, tag);
  else renderChoice(q, tag);
}

function renderDict(q, tag) {
  quizEl.innerHTML = tag + `
    <div class="q-no">QUESTION ${cur+1} · 拼读检测</div>
    <div class="q-text">${q.prompt}</div>
    <div class="hint">像老师考单词一样：先<b>读出单词</b>，再<b>逐个字母拼读</b>（如 p-r-e-s-s-u-r-e）</div>
    <button class="speak-btn" onclick="speakWord('${q.word}')">🔊 听发音</button>
    <div class="mode-tabs">
      <div class="mode-tab active" id="tabVoice" onclick="setDictMode('voice')">🎤 语音拼读</div>
      <div class="mode-tab" id="tabType" onclick="setDictMode('type')">✍️ 打字拼写</div>
    </div>
    <div id="voiceArea">
      <div class="mic-row" id="micRow"></div>
      <div class="speech-fb" id="speechFb"></div>
    </div>
    <div id="typeArea" style="display:none;">
      <input class="spell-input" id="spellInput" type="text" inputmode="latin" autocomplete="off" autocapitalize="none" autocorrect="off" placeholder="输入英文单词后点确定">
      <button class="submit-btn" onclick="submitSpell()">确定</button>
    </div>
    <div class="feedback" id="feedback"></div>
  `;
  initVoiceArea(q);
}

function setDictMode(m) {
  document.getElementById('tabVoice').classList.toggle('active', m === 'voice');
  document.getElementById('tabType').classList.toggle('active', m === 'type');
  document.getElementById('voiceArea').style.display = m === 'voice' ? 'block' : 'none';
  document.getElementById('typeArea').style.display = m === 'type' ? 'block' : 'none';
  if (m === 'type') {
    setTimeout(() => document.getElementById('spellInput').focus(), 100);
  }
}

function initVoiceArea(q) {
  const micRow = document.getElementById('micRow');
  if (SR) {
    micRow.innerHTML = `<button class="mic-btn" id="micBtn">🎤 点我开始拼读</button>`;
    document.getElementById('micBtn').addEventListener('click', () => startSpellRecog(q));
  } else {
    micRow.innerHTML = `
      <button class="self-btn" onclick="selfSay(1)">🗣️ 已大声拼读给家长听 ✓</button>
      <button class="self-btn" onclick="selfSay(0)">🤔 还不会</button>`;
  }
}

function startSpellRecog(q) {
  const btn = document.getElementById('micBtn');
  const fb = document.getElementById('speechFb');
  try {
    const recog = new SR();
    recog.lang = 'en-US'; recog.interimResults = false; recog.maxAlternatives = 5;
    btn.classList.add('listening'); btn.textContent = '🎙️ 正在听…读单词+拼字母';
    recog.onresult = (e) => {
      const alts = [...e.results[0]].map(r => r.transcript);
      const saidWord = alts.some(s => s.toLowerCase().replace(/[^a-z]/g,'') === q.word);
      const spelled = alts.map(s => normLetters(s));
      const spelledOK = spelled.some(s => s === q.word);
      finishDict(q, saidWord || spelledOK, alts[0]);
    };
    recog.onerror = (ev) => {
      fb.className = 'speech-fb no';
      fb.textContent = ev.error === 'not-allowed'
        ? '🎤 麦克风权限被拒，请切换到「打字拼写」'
        : '🎤 没听清，可重试或切换到「打字拼写」';
      btn.classList.remove('listening'); btn.textContent = '🎤 点我开始拼读';
    };
    recog.onend = () => {
      btn.classList.remove('listening'); btn.textContent = '🎤 点我开始拼读';
    };
    recog.start();
  } catch(e) {
    fb.className = 'speech-fb no';
    fb.textContent = '语音不可用，请切换到「打字拼写」';
    btn.style.display = 'none';
  }
}

function selfSay(v) {
  const q = QUESTIONS[cur];
  finishDict(q, v === 1, v === 1 ? '（家长确认已拼读）' : '');
}

function submitSpell() {
  if (answered) return;
  const q = QUESTIONS[cur];
  const v = document.getElementById('spellInput').value.toLowerCase().replace(/[^a-z]/g, '');
  if (!v) return;
  finishDict(q, v === q.word, v);
}

function finishDict(q, ok, heard) {
  if (answered) return;
  answered = true;
  const fb = document.getElementById('speechFb');
  const ans = document.getElementById('feedback');
  if (ok) {
    score++;
    fb.className = 'speech-fb ok';
    fb.textContent = heard && !heard.startsWith('（') ? `✅ 听到：「${heard}」` : '✅ 拼读完成';
    ans.className = 'feedback ok';
    ans.textContent = `🎉 正确：${q.word}（${q.meaning}）`;
  } else {
    fb.className = 'speech-fb no';
    fb.textContent = heard ? `🔊 听到：「${heard}」` : '🤔 没关系，看答案跟读';
    ans.className = 'feedback no';
    ans.textContent = `✏️ 正确拼读：${q.word.split('').join('-')}（${q.meaning}）`;
    wrongs.push(q);
  }
  const btn = document.getElementById('micBtn');
  if (btn) btn.disabled = true;
  const input = document.getElementById('spellInput');
  if (input) input.disabled = true;
  nextBtn.disabled = false;
}

function renderChoice(q, tag) {
  quizEl.innerHTML = tag + `
    <div class="q-no">QUESTION ${cur+1}</div>
    <div class="q-text">${q.prompt}</div>
    ${q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="tag">${'ABCD'[i]}</span>${o}</button>`).join('')}
  `;
  quizEl.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => pickChoice(parseInt(btn.dataset.i)));
  });
}

function pickChoice(i) {
  if (answered) return;
  answered = true;
  const q = QUESTIONS[cur];
  const opts = quizEl.querySelectorAll('.opt');
  opts.forEach(b => b.disabled = true);
  opts[q.answer].classList.add('correct');
  if (i === q.answer) score++;
  else { opts[i].classList.add('wrong'); wrongs.push(q); }
  nextBtn.disabled = false;
}

nextBtn.addEventListener('click', () => {
  if (cur < QUESTIONS.length - 1) { cur++; render(); }
  else showResult();
});

function showResult() {
  bar.style.width = '100%';
  document.getElementById('quizCard').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('scoreNum').textContent = score;
  const pct = score / QUESTIONS.length;
  const v = document.getElementById('verdict');
  if (pct === 1) v.textContent = '🎉 满分！太厉害了！';
  else if (pct >= 0.9) v.textContent = '🌟 优秀！错的几处再巩固一下';
  else if (pct >= 0.8) v.textContent = '👍 很棒！错题要重点复习';
  else if (pct >= 0.6) v.textContent = '💪 还不错，但还有提升空间';
  else v.textContent = '📖 单词还不够熟，明早再背一遍';
  if (wrongs.length) {
    document.getElementById('wrongList').classList.remove('hidden');
    document.getElementById('wrongs').innerHTML =
      wrongs.map(q => `<li><b>${q.word}</b>${q.meaning ? ' — ' + q.meaning : ''}</li>`).join('');
  }
}

render();
</script>
</body>
</html>
